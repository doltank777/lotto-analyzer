name: Lotto Analyzer CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python 기본 검증
    runs-on: windows-latest

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Python 버전 확인
        run: python --version

      - name: pip 업그레이드
        run: python -m pip install --upgrade pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 주요 모듈 Import 검증
        run: |
          python -c "import pandas"
          python -c "import numpy"
          python -c "import matplotlib"
          python -c "import PIL"
          python -c "import reportlab"
          python -c "from src.db.database import init_db, get_latest_draw_no"

      - name: SQLite 초기화 검증
        run: |
          python -c "from src.db.database import init_db, get_latest_draw_no; init_db(); print('Latest draw:', get_latest_draw_no())"

      - name: 생성된 DB 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "database/lotto.db")) {
              Write-Error "database/lotto.db 생성 실패"
              exit 1
          }

          Write-Host "database/lotto.db 생성 확인 완료"

      - name: CI 완료
        run: echo "Lotto Analyzer CI 검증 성공"