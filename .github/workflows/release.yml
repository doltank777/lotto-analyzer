name: Lotto Analyzer Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    name: Windows Release 배포
    runs-on: windows-latest

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v5

      - name: Python 3.12 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Python 버전 확인
        run: python --version

      - name: pip 업그레이드
        run: python -m pip install --upgrade pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 버전 정보 일치 검증
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag.TrimStart("v")

          Write-Host "========================================="
          Write-Host "Lotto Analyzer Release Version Check"
          Write-Host "========================================="
          Write-Host "Git Tag Version : $tagVersion"
          Write-Host ""

          # ---------------------------------------
          # build_release.py
          # ---------------------------------------

          $buildContent = Get-Content "build_release.py" -Raw

          if ($buildContent -notmatch 'VERSION\s*=\s*"([^"]+)"') {
              Write-Error "build_release.py에서 VERSION 값을 찾을 수 없습니다."
              exit 1
          }

          $buildVersion = $matches[1]

          Write-Host "build_release.py : $buildVersion"

          # ---------------------------------------
          # src/gui/theme.py
          # ---------------------------------------

          $themeContent = Get-Content "src/gui/theme.py" -Raw

          if ($themeContent -notmatch 'VERSION\s*=\s*"([^"]+)"') {
              Write-Error "src/gui/theme.py에서 VERSION 값을 찾을 수 없습니다."
              exit 1
          }

          $themeVersion = $matches[1]

          Write-Host "theme.py         : $themeVersion"

          # ---------------------------------------
          # version_info.txt
          # ---------------------------------------

          $versionInfoContent = Get-Content "version_info.txt" -Raw

          if ($versionInfoContent -notmatch "FileVersion['""]?\s*[,=]\s*['""]([^'""]+)") {

              if ($versionInfoContent -notmatch "FileVersion.*?(\d+\.\d+\.\d+)") {
                  Write-Error "version_info.txt에서 FileVersion 값을 찾을 수 없습니다."
                  exit 1
              }
          }

          $versionInfoVersion = $matches[1]

          Write-Host "version_info.txt : $versionInfoVersion"

          # ---------------------------------------
          # README.txt
          # ---------------------------------------

          $readmeContent = Get-Content "README.txt" -Raw

          $escapedVersion = [regex]::Escape($tagVersion)

          if ($readmeContent -notmatch "Version\s+$escapedVersion") {
              Write-Error "README.txt에서 Version $tagVersion 정보를 찾을 수 없습니다."
              exit 1
          }

          $readmeVersion = $tagVersion

          Write-Host "README.txt       : $readmeVersion"

          Write-Host ""
          Write-Host "========================================="
          Write-Host "Version Comparison"
          Write-Host "========================================="

          $versionMismatch = $false

          if ($tagVersion -ne $buildVersion) {
              Write-Error "build_release.py VERSION 불일치"
              $versionMismatch = $true
          }

          if ($tagVersion -ne $themeVersion) {
              Write-Error "theme.py VERSION 불일치"
              $versionMismatch = $true
          }

          if ($tagVersion -ne $versionInfoVersion) {
              Write-Error "version_info.txt FileVersion 불일치"
              $versionMismatch = $true
          }

          if ($tagVersion -ne $readmeVersion) {
              Write-Error "README.txt VERSION 불일치"
              $versionMismatch = $true
          }

          if ($versionMismatch) {
              Write-Host ""
              Write-Error "Release 버전 정보가 서로 일치하지 않습니다."
              exit 1
          }

          Write-Host ""
          Write-Host "모든 버전 정보가 일치합니다."
          Write-Host "Release Version: $tagVersion"

      - name: Release용 SQLite DB 생성
        run: |
          python -c "from src.db.database import init_db; init_db(); print('Release database initialized')"

      - name: Release용 DB 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "database/lotto.db")) {
              Write-Error "database/lotto.db 생성 실패"
              exit 1
          }

          Write-Host "database/lotto.db 생성 확인 완료"

      - name: PyInstaller Release 빌드
        run: python build_release.py

      - name: Release 패키지 확인
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          $releasePath = "release/Lotto Analyzer $version"
          $exePath = "$releasePath/Lotto Analyzer.exe"
          $dbPath = "$releasePath/database/lotto.db"
          $settingsPath = "$releasePath/config/recommendation_settings.json"
          $readmePath = "$releasePath/README.txt"
          $licensePath = "$releasePath/LICENSE.txt"

          $requiredFiles = @(
              $exePath,
              $dbPath,
              $settingsPath,
              $readmePath,
              $licensePath
          )

          foreach ($file in $requiredFiles) {

              if (-not (Test-Path $file)) {
                  Write-Error "Release 필수 파일을 찾을 수 없습니다: $file"
                  exit 1
              }

              Write-Host "확인: $file"
          }

          Write-Host ""
          Write-Host "Release 패키지 검증 완료"

      - name: ZIP 패키지 생성
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          $releasePath = "release/Lotto Analyzer $version"
          $zipPath = "release/Lotto Analyzer $version.zip"

          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path $releasePath `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (-not (Test-Path $zipPath)) {
              Write-Error "ZIP 파일 생성 실패"
              exit 1
          }

          $zipInfo = Get-Item $zipPath

          Write-Host "ZIP 생성 완료"
          Write-Host "파일: $($zipInfo.Name)"
          Write-Host "크기: $($zipInfo.Length) bytes"

      - name: GitHub Release 생성
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")

          $zipPath = "release/Lotto Analyzer $version.zip"

          gh release create `
            "$tag" `
            "$zipPath" `
            --title "Lotto Analyzer $version" `
            --generate-notes `
            --verify-tag

          Write-Host ""
          Write-Host "GitHub Release 생성 완료"
          Write-Host "Version: $version"