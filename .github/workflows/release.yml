name: Lotto Analyzer Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    name: Windows Release 배포
    runs-on: windows-latest

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v5

      - name: Python 3.12 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Python 버전 확인
        run: python --version

      - name: pip 업그레이드
        run: python -m pip install --upgrade pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 태그와 프로그램 버전 일치 확인
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          $content = Get-Content "build_release.py" -Raw

          if ($content -notmatch 'VERSION\s*=\s*"([^"]+)"') {
              Write-Error "build_release.py에서 VERSION 값을 찾을 수 없습니다."
              exit 1
          }

          $appVersion = $matches[1]

          Write-Host "Git Tag Version : $tagVersion"
          Write-Host "App Version     : $appVersion"

          if ($tagVersion -ne $appVersion) {
              Write-Error "Git Tag 버전과 프로그램 버전이 일치하지 않습니다."
              Write-Error "Tag: $tagVersion / App: $appVersion"
              exit 1
          }

          Write-Host "버전 일치 확인 완료"

      - name: Release용 SQLite DB 생성
        run: |
          python -c "from src.db.database import init_db; init_db(); print('Release database initialized')"

      - name: Release용 DB 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "database/lotto.db")) {
              Write-Error "database/lotto.db 생성 실패"
              exit 1
          }

          Write-Host "database/lotto.db 생성 확인 완료"

      - name: PyInstaller Release 빌드
        run: python build_release.py

      - name: Release 패키지 확인
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $releasePath = "release/Lotto Analyzer $version"

          if (-not (Test-Path $releasePath)) {
              Write-Error "Release 패키지를 찾을 수 없습니다: $releasePath"
              exit 1
          }

          if (-not (Test-Path "$releasePath/Lotto Analyzer.exe")) {
              Write-Error "Lotto Analyzer.exe를 찾을 수 없습니다."
              exit 1
          }

          Write-Host "Release 패키지 확인 완료"

          Get-ChildItem $releasePath -Recurse

      - name: ZIP 패키지 생성
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          $releasePath = "release/Lotto Analyzer $version"
          $zipPath = "release/Lotto Analyzer $version.zip"

          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path $releasePath `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (-not (Test-Path $zipPath)) {
              Write-Error "ZIP 파일 생성 실패"
              exit 1
          }

          Write-Host "ZIP 생성 완료: $zipPath"

      - name: GitHub Release 생성
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $zipPath = "release/Lotto Analyzer $version.zip"

          gh release create `
            "$tag" `
            "$zipPath" `
            --title "Lotto Analyzer $version" `
            --generate-notes `
            --verify-tag